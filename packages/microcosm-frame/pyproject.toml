[project]
name = "microcosm-frame"
version = "0.1.0"
description = "The microcosm kernel: the Frame (weighted sampling frame of entity tables), typed weights, strata, links, weighted accounting, unit structure, and the rules-engine protocol"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "microcosm-graph>=0.1,<0.2",
    "numpy>=2",
    "pandas>=2.3",
]

[tool.uv.sources]
microcosm-graph = { workspace = true }

[project.optional-dependencies]
us = ["microunit>=0.1.0"]
policyengine = ["policyengine-us>=1.745.0,<2", "microunit>=0.1.0"]
uk = ["policyengine-uk>=2.97.0"]
# The Axiom adapter's PyPI-resolvable dependencies. The engine itself
# (axiom-rules-engine + its dense native extension) is not on PyPI yet and
# installs from a checkout; see microcosm/frame/adapters/axiom.py.
axiom = ["tables>=3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "microunit>=0.1.0",
    # AxiomEntityTableDataset round-trip tests exercise the HDF5 format
    # without any engine installed.
    "tables>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/microcosm"]
