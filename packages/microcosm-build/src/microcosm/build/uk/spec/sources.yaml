- stage: frs_hmrc_retained_leaves
  survey: Family Resources Survey 2024-25
  source: Department for Work and Pensions Family Resources Survey 2024-25 raw adult.tab and benefits.tab, caller-supplied local input
  grain: person
  artifacts: []
  operations:
  - kind: verify_certified_candidate
    artifact: base_candidate
    runtime_sha256_required: true
    fail_on_mismatch: true
  - kind: retain_adjudicated_frs_hmrc_leaves
    population: certified_microcosm_uk_candidate_base_channel
    source_vintage: 2024-25
    mapped_build_period: 2024
    annualization: weekly raw FRS amounts * (365.25 / 7)
    status: adjudicated_partial_replay
    retained_full_constituents:
      hmrc_spi_pay:
        spi_concept: PAY
        scope: full
        raw_sources:
        - ADULT.INEARNS
        formula: max(0, ADULT.INEARNS) * (365.25 / 7)
      hmrc_spi_unemployment_benefit_income:
        spi_concept: UBISJA
        scope: full
        raw_sources:
        - BENEFITS.BENEFIT=14:BENAMT
        - BENEFITS.BENEFIT=19:BENAMT
        formula: sum(BENAMT where BENEFIT in {14, 19}) * (365.25 / 7)
      hmrc_spi_incapacity_benefit_income:
        spi_concept: INCPBEN
        scope: full
        raw_sources:
        - BENEFITS.BENEFIT=17:BENAMT
        formula: sum(BENAMT where BENEFIT == 17) * (365.25 / 7)
        observed_support: structural zero in the audited 2023-24 FRS; retained so future vintages flow
    retained_named_subsets:
      ossben_identifiable_subset:
        spi_concept: OSSBEN
        raw_sources:
        - BENEFITS.BENEFIT=13:BENAMT
        - BENEFITS.BENEFIT=16,VAR2 in {1,3}:BENAMT
        formula: sum(BENAMT where BENEFIT == 13 or (BENEFIT == 16 and VAR2 in {1, 3})) * (365.25 / 7)
        scope: identifiable_subset
      srp_regular_code5:
        spi_concept: SRP
        raw_sources:
        - BENEFITS.BENEFIT=5:BENAMT
        formula: sum(BENAMT where BENEFIT == 5) * (365.25 / 7)
        scope: regular_code5_subset
    source_absent_full_constituents:
    - EPB
    - EXPS
    - TAXTERM
    - MOTHINC
    - OTHERINC
    full_concepts_forbidden_on_frs:
    - hmrc_spi_employment_benefits
    - hmrc_spi_employment_expenses
    - hmrc_spi_taxable_termination_pay
    - hmrc_spi_miscellaneous_employment_income
    - hmrc_spi_other_income
    - hmrc_spi_other_social_security_income
    - hmrc_spi_state_pension_income
    forbid_proxy_substitution:
    - employment_income
    - miscellaneous_income
    fail_on_missing_retained_constituent: true
    fail_on_full_concept_alias: true
  outputs:
  - hmrc_spi_pay
  - hmrc_spi_unemployment_benefit_income
  - hmrc_spi_incapacity_benefit_income
  - ossben_identifiable_subset
  - srp_regular_code5
