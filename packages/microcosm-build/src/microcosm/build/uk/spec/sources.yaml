  - kind: replace_sentinels
    sentinel_policy: 'raw numeric blanks and nonnumeric sentinels are coerced to NaN, then produced E2 columns are filled to the Frame no-NaN contract. Clamping is deliberately per-column, mirroring the incumbent base build: redamt stays unclamped, tuborr clamps at zero, and the property/royalties components clamp only in their aggregate.'
  - kind: assemble_group_entities
    household_id: sernum
    benunit_id: sernum * 100 + benunit
    person_id: sernum * 1000 + person
    person_table: adult union child
    household_sort: set_index('household_id').sort_index() before positional household reads
  - kind: map_columns
    scope: 'raw-to-column E2 mappings and FRS claimant-role derivation (is_benunit_head OR is_parent OR no dependent children within the benefit unit) to is_uc_claimant; benunit.TOTCAPB4 -> frs_benunit_capital with blank, nonnumeric, or negative raw values -> named -1 unavailable sentinel (mapped-row count reported in stage evidence)'
