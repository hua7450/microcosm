- stage: age_tail
  survey: Family Resources Survey 2024-25 and ONS mid-year population estimates
  source: Office for National Statistics mid-year population estimates for the 80+ age bands by sex, via the chronicle ledger facts the calibration register binds (target family ons_population).
  grain: person
  artifacts:
  - role: age_tail_band_populations
    kind: public_aggregate_reference
    resource: ons_age_tail_band_populations.json
    format: json
    runtime_sha256_required: true
  operations:
  - kind: disaggregate_top_coded_ages
    output: age
    resource: ons_age_tail_band_populations.json
    top_code: 80
    bands:
    - name: '80_84'
      low: 80
      width: 5
    - name: '85_89'
      low: 85
      width: 5
    - name: '90_plus'
      low: 90
      width: 8
    seed: 0
    draw_key: person_id
    salt_streams:
    - band
    - within
    reason: Age disaggregation rewrites an existing person column in place; no rows
      move, no weights change, and total household mass is conserved.
  outputs: []
  rewrites:
  - age
  notes: "The licensed FRS records no age above 80, so every 80+ person arrives piled at exactly 80 and the 85-89 and 90+ population targets are structurally unbindable; the incumbent shares the defect. Each piled base person draws a band from the sex-specific ONS inverse CDF and a uniform integer age within it, keyed on person_id. Runs immediately after frs_spine, before every stage that conditions on age, so all age-conditioned imputations derive from the disaggregated surface. The stage precedes person_source_id provenance; later support and capital-gains clones copy the donor's rewritten age, preserving the #623 final-age identity invariant. Ages are assigned toward the ONS distribution; calibration still owns the totals."
- stage: frs_employment
  survey: Family Resources Survey 2024-25
