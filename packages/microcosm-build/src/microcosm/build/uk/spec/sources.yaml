    delimiter: "\t"
    lowercase_columns: true
    numeric_errors: coerce
    runtime_sha256_required: true
  - kind: map_coded_amounts
    scope: empstati employment status, mjobsect sector, and raw SIC division
  outputs:
  - employment_status
  - employment_sector
  - sic_industry_division
  nonnegative_outputs:
  - sic_industry_division
  notes: Ports FRS employment derivations. empstati code 11 preserves the incumbent truncated-map artifact as LONG_TERM_DISABLED, so OTHER_INACTIVE is not emitted; mjobsect and sic are direct-indexed and fail loudly if absent.
- stage: frs_council_tax
  survey: Family Resources Survey 2024-25
  source: Department for Work and Pensions Family Resources Survey 2024-25, UK Data Service SN 9563, DOI 10.5255/UKDA-SN-9563-1; local licensed 2024_25 tabs.
  grain: household
  artifacts:
  - role: frs_table
    table: househol
    kind: licensed_microdata
    format: tab
    vintage: '2024_25'
    locator: househol.tab
    sha256: 2b93b6aed49e1591d6f5360736b4aee3a11ef506b276435f4d2c011a8afbb6a5
    size_bytes: 12108606
    runtime_sha256_required: true
    tax_year_start: 2024
    ukds_study_number: 9563
