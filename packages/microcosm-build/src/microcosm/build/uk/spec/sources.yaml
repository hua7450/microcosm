    sha256: 88ec53fc52eea4374864bbc74219d551f4b4c5f54a220bf9607c7a6289719aa5
    size_bytes: 2753961
    runtime_sha256_required: true
    tax_year_start: 2024
    ukds_study_number: 9563
    doi: 10.5255/UKDA-SN-9563-1
  operations:
  - kind: read_tables
    format: tab
    delimiter: "\t"
    lowercase_columns: true
    numeric_errors: coerce
    runtime_sha256_required: true
  - kind: derive
    scope: current/highest education, QYP inputs, EMA cell-mean degenerate fills, and benefits-in-own-right flag
  - kind: impute_cell_means
    cells:
    - 'single cell: EMA participants (code == 1; adema/ademaamt pair, eduma/edumaamt when adema is absent; chema/chemaamt for children)'
    donor_filter: participants with non-negative reported amounts
    missing: participants with sentinel negative reported amounts
    value: donor-mean fill, floored at zero, annualized with 365.25 / 7
  outputs:
  - current_education
  - highest_education
  - is_in_non_advanced_education
  - is_in_approved_training
  - age_started_or_accepted_current_education_or_training
  - is_before_universal_credit_qualifying_young_person_terminal_date
  - adult_ema
  - child_ema
  - receives_benefits_in_own_right
  nonnegative_outputs:
  - adult_ema
  - child_ema
  - age_started_or_accepted_current_education_or_training
  notes: 'Ports the incumbent education cascade including its unreachable POST_SECONDARY branch order. EDUCQUAL_MAP carries the corrected highest-qualification codeframe (1 = Doctorate, descending) per the FRS 2024-25 data dictionary (UK Data Service SN 9563, DOI 10.5255/UKDA-SN-9563-1, adult table), corroborated against the raw aggregates and adopted as a signed difference (PR #703); an upstream defect report records the incumbent inversion. Codes 1-87 are empirically present at 2024-25; code 87 remains undocumented in the SN 9563 dictionary and falls to the default. EMA uses the shared weeks-in-year constant.'
- stage: frs_legacy_proxies
  survey: Family Resources Survey 2024-25
  source: Department for Work and Pensions Family Resources Survey 2024-25, UK Data Service SN 9563, DOI 10.5255/UKDA-SN-9563-1; local licensed 2024_25 tabs. plus policyengine-uk DWP parameters.
