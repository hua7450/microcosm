  notes: The proxies are labels, not entitlement determinations. JSA hours compare against 16 * (365.25 / 7) on the E2 spine hours scale; state_pension_age is consumed but not persisted.
- stage: frs_education_grant_split
  survey: Family Resources Survey 2024-25
  source: Department for Work and Pensions Family Resources Survey 2024-25, UK Data Service SN 9563, DOI 10.5255/UKDA-SN-9563-1; local licensed 2024_25 tabs. plus policyengine-uk DfE grant parameters.
  grain: person
  artifacts: []
  operations:
  - kind: materialize_rules_engine_predictors
    predictors:
    - childcare_grant
    - parents_learning_allowance
    - adult_dependants_grant
    consumed_only: true
    year_rule: survey_year
  - kind: materialize_rules_engine_predictors
    predictors:
    - maintenance_loan_in_england_system
    - disabled_students_allowance_course_eligible
    - disabled_students_allowance_has_qualifying_condition
    consumed_only: true
    year_rule: calibration_year
  - kind: derive
    scope: proportional split of aggregate education_grants and DSA residual capacity
    parameters: DSA maximum from gov.dfe.disabled_students_allowance.maximum at the calibration year
    year_rule: calibration_year
  outputs:
  - disabled_students_allowance_eligible_expenses
  rewrites:
  - education_grants
  nonnegative_outputs:
  - disabled_students_allowance_eligible_expenses
  notes: Runs before BRMA and always runs; the DSA seed evaluates at the release calibration year (uk-data#478) and the modelling-start gate compares against that year, not the frame period. EDUCQUAL grant-split compatibility is re-cited to the FRS 2024-25 SN 9563 dictionary; codes 1-87 are empirically present and code 87 remains undocumented/defaulted.
- stage: frs_take_up
  survey: Family Resources Survey 2024-25
  source: Family Resources Survey 2024-25 reported receipt anchors plus sourced UK take-up contract rates.
  grain: benunit
  artifacts: []
  operations:
  - kind: aggregate_person_to_benunit
    method: any_positive
    consumed_only: true
    aggregates:
      child_benefit_reported_anchor: child_benefit_reported
      pension_credit_reported_anchor: pension_credit_reported
      universal_credit_reported_anchor: universal_credit_reported
  - kind: assign_binary_with_anchored_residual
    output: would_claim_child_benefit
    draw: would_claim_child_benefit
    rate_key: child_benefit
    anchor: child_benefit_reported_anchor
    seed: 0
  - kind: assign_binary_from_rate
    output: child_benefit_opts_out
    draw: child_benefit_opts_out
    rate_key: child_benefit_opts_out_rate
    seed: 0
  - kind: assign_binary_with_anchored_residual
    output: would_claim_pc
    draw: would_claim_pc
    rate_key: pension_credit
    anchor: pension_credit_reported_anchor
    seed: 0
  - kind: assign_binary_with_anchored_residual
    output: would_claim_uc
    draw: would_claim_uc
    rate_key: universal_credit
    anchor: universal_credit_reported_anchor
    seed: 0
  - kind: assign_binary_from_rate
