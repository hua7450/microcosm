  operations:
  - kind: read_tables
    format: tab
    delimiter: "\t"
    lowercase_columns: true
    numeric_errors: coerce
    runtime_sha256_required: true
  - kind: impute_cell_means
    cells:
    - gvtregno
    - ctband
    - adulth == 1
    donor_filter: raw ctannual > 0
    missing: raw ctannual < 0 or NaN
    value: Scottish-water-netted CTANNUAL
  outputs:
  - council_tax
  nonnegative_outputs:
  - council_tax
  notes: Re-reads raw househol.tab because spine council_tax_reported clips missing values. Scottish Water charges are netted before cell means; no-donor cells impute zero. The dead ct_mean.replace(-1, ...) branch is intentionally dropped.
- stage: frs_disability
  survey: Family Resources Survey 2024-25
  source: Department for Work and Pensions Family Resources Survey 2024-25, UK Data Service SN 9563, DOI 10.5255/UKDA-SN-9563-1; local licensed 2024_25 tabs. plus policyengine-uk DWP parameters.
  grain: person
  artifacts: []
  operations:
  - kind: derive
    parameters: disability category thresholds from the fiscal-converted gov.dwp tree at the survey year
    year_rule: survey_year
  - kind: derive
    parameters: disability flags from the fiscal-converted gov.dwp tree at the survey year
    year_rule: survey_year
  outputs:
  - aa_category
  - dla_sc_category
  - dla_m_category
  - pip_m_category
  - pip_dl_category
  - is_disabled_for_benefits
  - is_enhanced_disabled_for_benefits
  - is_severely_disabled_for_benefits
  notes: Consumes E2 reported disability amount carriers. The five internal amount carriers are retained through E7 and stripped at E10; export allowlists stay fail-closed.
- stage: frs_education
  survey: Family Resources Survey 2024-25
  source: Department for Work and Pensions Family Resources Survey 2024-25, UK Data Service SN 9563, DOI 10.5255/UKDA-SN-9563-1; local licensed 2024_25 tabs.
  grain: person
  artifacts:
  - role: frs_table
    table: adult
    kind: licensed_microdata
    format: tab
    vintage: '2024_25'
    locator: adult.tab
    sha256: 4eaea0809a7ccca0fddeb98e358771e4a6e5ebb81b21c4fac4070fc9d227658d
    size_bytes: 34885825
